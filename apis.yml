name: Tact.ai
description: 'Tact.ai was a Redwood City, California conversational-AI and field-engagement
  company founded by Chuck Ganapathi that built an AI sales assistant ("Tact Assistant")
  unifying CRM, email, and calendar data into a voice- and chat-driven interface for
  enterprise sales teams, later concentrating on the life sciences vertical. It was
  backed by Accel, Redpoint Ventures, Upfront Ventures, Microsoft''s M12, and Salesforce
  Ventures. In November 2023 its field-engagement and conversational-AI technology was
  acquired by Aktana and the standalone company wound down. The tact.ai domain no longer
  hosts a product: it resolves to an Afternic domain-for-sale parking page (nameservers
  ns1/ns2.afternic.com), and the company exposes no public developer API, documentation,
  or developer portal to enrich.'
